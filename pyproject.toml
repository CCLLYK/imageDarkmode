[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-dark-mode"
version = "0.1.0"
description = "图片暗黑模式自动转换器 - 为网页、电子书、APP 提供高质量的暗黑模式图片适配方案"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "image-dark-mode", email = "your@email.com"}
]
keywords = ["dark-mode", "image", "converter", "accessibility", "dark-theme"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# 依赖下限对齐 Python 3.13 上实测可用的版本（完整钉版见 requirements.txt）
dependencies = [
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.4",
    "Pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "black>=26.10.1",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]

[project.scripts]
image-dark-mode = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# 注：flake8 不读取 pyproject.toml，其配置在根目录 .flake8 文件中
